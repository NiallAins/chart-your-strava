<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta -->
    <title>
        Charts your Strava
    </title>
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    />

    <!-- Styles -->
    <link
        rel="stylesheet"
        href="./style.css"
    />
</head>

<body>
    <div class="tabs">
        <button
            id="tabButton_charts"
            class="tabs__tab"
            role="tab"
            aria-controls="tabBody_charts"
        >
            Charts
        </button>
        <button
            id="tabButton_routes"
            class="tabs__tab"
            role="tab"
            aria-controls="tabBody_routes"
        >
            Routes
        </button>
        <button
            id="tabButton_map"
            class="tabs__tab"
            role="tab"
            aria-controls="tabBody_map"
        >
            Heatmap
        </button>
        <button
            id="tabButton_load"
            class="tabs__tab"
            role="tab"
            aria-controls="tabBody_load"
        >
            Load your data
        </button>
    </div>

    <div
        id="tabBody_charts"
        class="tabs__body charts"
        role="tabpanel"
        tabindex="0"
        aria-labelledby="tabButton_charts"
    ></div>
    <div
        id="tabBody_routes"
        class="tabs__body routes"
        role="tabpanel"
        tabindex="0"
        aria-labelledby="tabButton_routes"
    ></div>
    <div
        id="tabBody_map"
        class="tabs__body map"
        role="tabpanel"
        tabindex="0"
        aria-labelledby="tabButton_map"
    ></div>
    <div
        id="tabBody_load"
        class="tabs__body load"
        role="tabpanel"
        tabindex="0"
        aria-labelledby="tabButton_load"
    ></div>

    <script
        type="module"
        src="./js/main.js"
    ></script>
</body>

</html>
